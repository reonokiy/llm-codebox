services:
  app:
    build: .
    ports:
      - "12345:12345"
    environment:
      KERNEL_GATEWAY_URL: http://jupyter:9888
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
    depends_on:
      - jupyter
      - valkey
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:12345/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5

  jupyter:
    build: ./jupyter-gateway
    ports:
      - "9888:9888"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9888/api >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # device_ids = ['0']  # specify particular GPU(s) if needed
              count: all # use all available GPUs
              capabilities: [gpu]

  valkey:
    image: valkey/valkey:8
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  valkey-data:
